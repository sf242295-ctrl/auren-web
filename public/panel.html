<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi panel · Auren RP</title>
<meta name="description" content="Panel del jugador de Auren RP: tu cuenta de Discord y la solicitud de whitelist.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.panel-grid{display:grid;grid-template-columns:300px 1fr;gap:24px;align-items:start}
.panel-grid > *{min-width:0}
.profile{padding:24px;display:grid;gap:16px;position:sticky;top:100px}
.profile .who b{font-size:1.2rem;letter-spacing:-.02em}
.checklist{list-style:none;display:grid;gap:10px;padding-top:16px;border-top:1px solid var(--line);font-size:.9rem}
.checklist li{display:flex;gap:10px;align-items:center;color:var(--muted)}
.checklist li::before{content:"";width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-2);flex:none}
.checklist li.ok{color:var(--ink)}
.checklist li.ok::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px #0d1016}
.box{padding:clamp(22px,3.5vw,40px)}
.box h2{font-size:clamp(1.7rem,3vw,2.4rem);line-height:1.05}
.box > p{color:var(--soft);margin-top:10px;max-width:62ch}
form{display:grid;gap:20px;margin-top:26px}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.count{justify-self:end;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.count.short{color:#d9b25c}
.check{display:flex;gap:12px;align-items:flex-start;font-size:.92rem;color:var(--soft)}
.check input{width:18px;height:18px;accent-color:#f3f4f6;margin-top:3px;flex:none}
.check a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.err{padding:11px 14px;border-radius:12px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);color:#fecaca;font-size:.9rem}
.done-box{display:grid;gap:14px;justify-items:start}
.big-ok{width:52px;height:52px;border-radius:14px;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.4);display:grid;place-items:center;color:var(--ok)}
.login-box{text-align:center;display:grid;justify-items:center;gap:14px;padding:clamp(36px,6vw,64px) 22px}
.login-box h2{font-size:clamp(1.8rem,3.6vw,2.6rem);line-height:1.05}
.login-box p{max-width:46ch;color:var(--soft)}
@media (max-width:960px){
  .panel-grid{grid-template-columns:1fr}
  .profile{position:static}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body data-page="panel" data-city="dim">
<header id="siteHeader"></header>

<main class="wrap">
  <div class="page-head">
    <h1>Mi panel</h1>
    <p>Tu cuenta de Discord y tu solicitud de whitelist, en un solo sitio.</p>
  </div>
  <div id="app"><div class="card box"><p>Cargando tu cuenta…</p></div></div>
</main>

<footer id="siteFooter"></footer>

<script src="assets/site.js"></script>
<script src="assets/city.js"></script>
<script>
(function(){
  const A = window.Auren, C = A.config, esc = A.esc, app = document.getElementById("app");
  const getCookie = n => (document.cookie.split("; ").find(c=>c.startsWith(n+"=")) || "").split("=")[1];

  const FIELDS = { personaje:[3,60], edad:[1,3], historia:[200,1500], mg:[30,500], pg:[30,500], situacion:[30,500], experiencia:[1,40], conocio:[0,100] };

  function loginView(){
    app.innerHTML = `<div class="card login-box">
      <h2>Inicia sesión para continuar</h2>
      <p>Usamos tu cuenta de Discord para saber quién manda la solicitud y avisarte cuando el staff responda.</p>
      <a class="btn btn-primary" href="/api/auth/login" data-auth="login">${window.AUREN_ICON.discord}Iniciar sesión con Discord</a>
    </div>`;
  }

  function sentView(when){
    const d = when ? new Date(+when) : null;
    return `<div class="done-box">
      <span class="big-ok"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
      <h2>Solicitud enviada</h2>
      <p style="color:var(--soft)">${d ? `La mandaste el ${d.toLocaleDateString("es",{day:"numeric",month:"long"})} a las ${d.toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})}. ` : ""}El staff la revisa y te responde por Discord. Si te la rechazan, podrás enviar otra pasadas 24 horas.</p>
      <a class="btn btn-ghost" href="${esc(C.discord)}" target="_blank" rel="noopener">Ir al Discord</a>
    </div>`;
  }

  function formView(u){
    const blocked = u.member === false;
    return `
      <h2>Solicitud de whitelist</h2>
      <p>Cuéntanos de tu personaje y responde con tus palabras. Respuestas copiadas o de una línea se rechazan.</p>
      ${blocked ? `<div class="err" style="margin-top:18px">Primero únete al <a href="${esc(C.discord)}" target="_blank" rel="noopener" style="color:inherit;border-bottom:1px solid">Discord de Auren</a> y vuelve a iniciar sesión.</div>` : ""}
      <form id="wl" novalidate>
        <div class="row2">
          <div class="field"><label for="personaje">Nombre y apellido del personaje</label><input class="input" id="personaje" name="personaje" maxlength="60" required placeholder="Ej. Joel Santana"></div>
          <div class="field"><label for="edad">Tu edad</label><input class="input" id="edad" name="edad" inputmode="numeric" maxlength="3" required placeholder="Ej. 21"></div>
        </div>
        <div class="field"><label for="historia">Historia del personaje</label><small>De dónde viene, qué busca en Auren y cómo es. Mínimo 200 caracteres.</small>
          <textarea class="input" id="historia" name="historia" maxlength="1500" required style="min-height:200px"></textarea><span class="count" data-for="historia"></span></div>
        <div class="field"><label for="mg">¿Qué es el metagaming? Pon un ejemplo</label>
          <textarea class="input" id="mg" name="mg" maxlength="500" required></textarea><span class="count" data-for="mg"></span></div>
        <div class="field"><label for="pg">¿Qué es el powergaming? Pon un ejemplo</label>
          <textarea class="input" id="pg" name="pg" maxlength="500" required></textarea><span class="count" data-for="pg"></span></div>
        <div class="field"><label for="situacion">Te apuntan con un arma y te piden la cartera. ¿Qué hace tu personaje?</label>
          <textarea class="input" id="situacion" name="situacion" maxlength="500" required></textarea><span class="count" data-for="situacion"></span></div>
        <div class="row2">
          <div class="field"><label for="experiencia">Experiencia en roleplay</label>
            <select class="input" id="experiencia" name="experiencia" required>
              <option value="">Elige una opción</option><option>Ninguna, es mi primera vez</option><option>Menos de 6 meses</option><option>De 6 meses a 2 años</option><option>Más de 2 años</option>
            </select></div>
          <div class="field"><label for="conocio">¿Cómo nos conociste? <small>(opcional)</small></label><input class="input" id="conocio" name="conocio" maxlength="100" placeholder="TikTok, un amigo…"></div>
        </div>
        <label class="check"><input type="checkbox" id="leido" required> <span>He leído y acepto las <a href="normativas.html" target="_blank">normativas de Auren</a>.</span></label>
        <div class="err" id="formErr" role="alert" hidden></div>
        <div><button class="btn btn-primary" type="submit" id="sendBtn"${blocked?" disabled":""}>Enviar solicitud</button></div>
      </form>`;
  }

  function userView(u){
    const sent = getCookie("auren_wl");
    const inDiscord = u.member !== false;
    app.innerHTML = `<div class="panel-grid">
      <aside class="card profile">
        <div class="who">${A.avatarHTML(u,"lg")}<div><b>${esc(u.name)}</b><small>@${esc(u.username)}</small></div></div>
        ${A.statusPill(u)}
        <ul class="checklist" aria-label="Tu progreso">
          <li class="ok">Sesión iniciada con Discord</li>
          <li class="${inDiscord?"ok":""}">En el Discord de Auren</li>
          <li class="${sent?"ok":""}">Whitelist enviada</li>
          <li class="${u.verified===true?"ok":""}">Whitelist aprobada</li>
        </ul>
        <a class="btn btn-ghost" href="/api/auth/logout" style="justify-content:center">Cerrar sesión</a>
      </aside>
      <div class="card box" id="box">${u.verified === true ? `<div class="done-box"><span class="big-ok"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span><h2>Ya tienes acceso</h2><p style="color:var(--soft)">Tu cuenta está verificada. Nos vemos en la ciudad.</p><a class="btn btn-primary" href="#" data-connect>Conectar al servidor</a></div>` : sent ? sentView(sent) : formView(u)}</div>
    </div>`;
    const form = document.getElementById("wl");
    if(form) wire(form);
  }

  function wire(form){
    const counters = form.querySelectorAll(".count");
    const upd = ()=> counters.forEach(c=>{
      const el = form.elements[c.dataset.for], [min,max] = FIELDS[c.dataset.for], n = el.value.trim().length;
      c.textContent = `${n} / ${max}` + (n < min ? ` · mínimo ${min}` : "");
      c.classList.toggle("short", n < min);
    });
    form.addEventListener("input", upd); upd();

    form.addEventListener("submit", async e=>{
      e.preventDefault();
      const err = document.getElementById("formErr"), btn = document.getElementById("sendBtn");
      const data = Object.fromEntries(new FormData(form));
      for(const [k,[min]] of Object.entries(FIELDS)){
        if((data[k]||"").trim().length < min){
          const label = form.querySelector(`label[for="${k}"]`).childNodes[0].textContent.trim();
          err.textContent = `Revisa “${label}”: ${min > 1 ? `necesita al menos ${min} caracteres.` : "es obligatorio."}`;
          err.hidden = false; form.elements[k].focus(); return;
        }
      }
      if(!/^\d{1,3}$/.test(data.edad.trim())){ err.textContent = "Escribe tu edad solo con números."; err.hidden = false; form.elements.edad.focus(); return; }
      if(!document.getElementById("leido").checked){ err.textContent = "Marca la casilla de normativas para continuar."; err.hidden = false; return; }
      err.hidden = true; btn.disabled = true; btn.textContent = "Enviando…";
      try{
        const r = await fetch("/api/whitelist", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(data), credentials:"same-origin"});
        const res = await r.json().catch(()=>({}));
        if(!r.ok) throw new Error(res.error || "No se pudo enviar la solicitud.");
        document.getElementById("box").innerHTML = sentView(Date.now());
        A.toast("Solicitud enviada al staff.");
      }catch(ex){
        err.textContent = ex.message + " Si sigue fallando, abre un ticket en el Discord.";
        err.hidden = false; btn.disabled = false; btn.textContent = "Enviar solicitud";
      }
    });
  }

  A.user.then(u=> u ? userView(u) : loginView());
})();
</script>
</body>
</html>
