<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Normativas · Auren RP</title>
<meta name="description" content="Normativas de Auren RP: reglas generales, de rol, delictivas, policía, vehículos y más.">
<meta name="theme-color" content="#06070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.rules-layout{display:grid;grid-template-columns:270px 1fr;gap:24px;align-items:start}
.rules-layout > *{min-width:0}
#rules{padding:clamp(18px,3vw,36px)}
.cats{position:sticky;top:100px;padding:10px;max-height:calc(100vh - 120px);overflow:auto}
.cats .search{margin:2px 2px 10px}
.cats ul{list-style:none;display:grid;gap:2px}
.cats a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--soft);font-size:.9rem;transition:background .15s,color .15s}
.cats a:hover{background:var(--surface-2);color:var(--ink)}
.cats a[aria-current="true"]{background:rgba(255,255,255,.07);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.cats .code{font-size:.74rem;font-weight:500;color:var(--muted);width:32px;flex:none}
.cats .nm{flex:1;min-width:0}
.cats .n{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cat{scroll-margin-top:100px}
.cat + .cat{margin-top:3.5rem}
.cat-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.cat-head h2{font-size:clamp(1.5rem,2.6vw,2rem);line-height:1.1}
.cat-head .bullet{font-size:.74rem;font-weight:600;padding:4px 8px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--soft)}
.cat-head p{color:var(--muted);width:100%;font-size:.9rem}
.rule{display:grid;grid-template-columns:84px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);scroll-margin-top:100px}
.rule:last-child{border-bottom:0}
.rule:target{background:rgba(255,255,255,.05);margin-inline:-14px;padding-inline:14px;border-radius:12px}
.rcode{font:inherit;font-size:.82rem;font-weight:500;color:var(--muted);background:none;border:0;cursor:pointer;text-align:left;align-self:start;padding:2px 0;font-variant-numeric:tabular-nums}
.rcode:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.rule h3{font-size:1rem;font-weight:600;letter-spacing:-.01em}
.rule p{color:var(--soft);margin-top:4px;max-width:68ch;font-size:.95rem}
mark{background:rgba(255,255,255,.16);color:var(--ink);border-radius:4px;padding:0 2px}
.empty{padding:2rem 0;color:var(--muted)}
@media (max-width:960px){
  .rules-layout{grid-template-columns:1fr;gap:16px}
  .cats{position:static;max-height:none}
  .cats ul{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  .cats a{white-space:nowrap;border:1px solid var(--line)}
  .cats .n{display:none}
  .rule{grid-template-columns:1fr;gap:4px}
}
</style>
</head>
<body data-page="normativas" data-city="dim">
<header id="siteHeader"></header>

<main class="wrap">
  <div class="page-head">
    <h1>Normativas</h1>
    <p>Las reglas de la ciudad. Léelas antes de mandar tu whitelist: el staff te va a preguntar por ellas.</p>
    <div class="meta"><span class="pill" id="summary"></span><span class="pill" id="updated"></span></div>
  </div>

  <div class="rules-layout">
    <nav class="card cats" aria-label="Categorías">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="q" type="search" placeholder="Buscar una regla" aria-label="Buscar una regla" autocomplete="off">
      </div>
      <ul id="catList"></ul>
    </nav>
    <div class="card" id="rules"></div>
  </div>
</main>

<footer id="siteFooter"></footer>

<script src="assets/site.js"></script>
<script src="assets/city.js"></script>
<script src="data/normativas.js"></script>
<script>
(function(){
  const A = window.Auren, N = window.AUREN_NORMATIVAS, esc = A.esc;
  const pad = n => String(n).padStart(2,"0");
  const total = N.categorias.reduce((s,c)=> s + c.reglas.length, 0);
  document.getElementById("summary").textContent = `${total} reglas en ${N.categorias.length} categorías`;
  const d = new Date(N.actualizado + "T12:00:00");
  document.getElementById("updated").textContent = "Actualizadas el " + d.toLocaleDateString("es", {day:"numeric", month:"long", year:"numeric"});

  const catList = document.getElementById("catList"), rulesEl = document.getElementById("rules"), q = document.getElementById("q");

  function hi(text, term){
    const safe = esc(text);
    if(!term) return safe;
    const re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "ig");
    return safe.replace(re, "<mark>$1</mark>");
  }
  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

  function render(term=""){
    const t = norm(term.trim());
    let shown = 0;
    const cats = N.categorias.map(c=>{
      const rules = c.reglas.map((r,i)=>({...r, code:`${c.id}-${pad(i+1)}`}))
        .filter(r=> !t || norm(r.t + " " + r.d + " " + r.code).includes(t));
      shown += rules.length;
      return {c, rules};
    }).filter(x=> x.rules.length);

    catList.innerHTML = N.categorias.map(c=>{
      const hit = cats.find(x=>x.c===c);
      return `<li><a href="#${c.id}" data-cat="${c.id}"><span class="code">${c.id}</span><span class="nm">${esc(c.nombre)}</span><span class="n">${hit ? hit.rules.length : 0}</span></a></li>`;
    }).join("");

    rulesEl.innerHTML = cats.length ? cats.map(({c,rules})=>`
      <section class="cat" id="${c.id}" style="padding:0" aria-labelledby="h-${c.id}">
        <div class="cat-head"><span class="bullet">${c.id}</span><h2 id="h-${c.id}">${esc(c.nombre)}</h2><p>${esc(c.desc)} ${rules.length} ${rules.length===1?"regla":"reglas"}.</p></div>
        ${rules.map(r=>`
          <article class="rule" id="${r.code}">
            <button class="rcode" type="button" data-rule="${r.code}" title="Copiar enlace a esta regla">${r.code}</button>
            <div><h3>${hi(r.t, term.trim())}</h3><p>${hi(r.d, term.trim())}</p></div>
          </article>`).join("")}
      </section>`).join("")
      : `<p class="empty">No hay reglas que coincidan con “${esc(term)}”. Prueba con otra palabra, por ejemplo “robo” o “policía”.</p>`;
    spy();
  }

  q.addEventListener("input", ()=> render(q.value));

  // copiar enlace a una regla
  rulesEl.addEventListener("click", e=>{
    const b = e.target.closest("[data-rule]"); if(!b) return;
    const url = location.origin + location.pathname + "#" + b.dataset.rule;
    history.replaceState(null, "", "#" + b.dataset.rule);
    A.copy(url, b);
  });

  // categoría activa al hacer scroll
  function spy(){
    const secs = [...document.querySelectorAll(".cat")];
    let active = secs[0] && secs[0].id;
    secs.forEach(s=>{ if(s.getBoundingClientRect().top < 160) active = s.id; });
    catList.querySelectorAll("a").forEach(a=> a.setAttribute("aria-current", a.dataset.cat === active));
  }
  addEventListener("scroll", spy, {passive:true});

  render();
  if(location.hash){ const el = document.getElementById(location.hash.slice(1)); if(el) setTimeout(()=> el.scrollIntoView(), 50); }
})();
</script>
</body>
</html>
