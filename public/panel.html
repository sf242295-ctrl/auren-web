<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi cuenta · Auren RP</title>
<meta name="description" content="Tu cuenta de Auren RP: Discord vinculado y accesos rápidos.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06070a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.acc-grid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.acc-grid > *{min-width:0}
.profile{padding:26px;display:grid;gap:16px}
.profile .who b{font-size:1.3rem;letter-spacing:-.02em}
.quick{padding:clamp(22px,3.5vw,36px)}
.quick h2{font-size:clamp(1.5rem,2.6vw,2rem);line-height:1.1}
.quick > p{color:var(--soft);margin-top:8px;max-width:60ch}
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:22px}
.link{display:grid;gap:4px;padding:18px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface-2);transition:border-color .15s,background .15s}
.link:hover{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.07)}
.link b{font-weight:600;font-size:1.05rem}
.link span{color:var(--soft);font-size:.95rem}
.login-box{text-align:center;display:grid;justify-items:center;gap:14px;padding:clamp(36px,6vw,64px) 22px}
.login-box h2{font-size:clamp(1.8rem,3.6vw,2.6rem);line-height:1.05}
.login-box p{max-width:46ch;color:var(--soft)}
@media (max-width:960px){ .acc-grid{grid-template-columns:1fr} }
@media (max-width:560px){ .links{grid-template-columns:1fr} }
</style>
</head>
<body data-page="panel" data-city="dim">
<header id="siteHeader"></header>

<main class="wrap" id="contenido" tabindex="-1">
  <div class="page-head">
    <h1>Mi cuenta</h1>
    <p>Tu cuenta de Discord vinculada y lo que más vas a usar.</p>
  </div>
  <div id="app"><div class="card quick"><p>Cargando tu cuenta…</p></div></div>
</main>

<footer id="siteFooter"></footer>

<script src="assets/site.js"></script>
<script src="assets/city.js"></script>
<script>
(function(){
  const A = window.Auren, C = A.config, esc = A.esc, app = document.getElementById("app");

  function loginView(){
    app.innerHTML = `<div class="card login-box">
      <h2>Inicia sesión para ver tu cuenta</h2>
      <p>Usamos tu cuenta de Discord para mostrarte tu perfil y, si eres staff, darte acceso al panel.</p>
      <a class="btn btn-primary" href="/api/auth/login" data-auth="login">${window.AUREN_ICON.discord}Iniciar sesión con Discord</a>
    </div>`;
  }

  function userView(u){
    app.innerHTML = `<div class="acc-grid">
      <aside class="card profile" aria-label="Tu perfil">
        <div class="who">${A.avatarHTML(u,"lg")}<div><b>${esc(u.name)}</b><small>@${esc(u.username)}</small></div></div>
        ${A.statusPill(u)}
        ${u.member === false ? `<a class="btn btn-primary" href="${esc(C.discord)}" target="_blank" rel="noopener">Unirse al Discord de Auren</a>` : ""}
        <a class="btn btn-ghost" href="/api/auth/logout">Cerrar sesión</a>
      </aside>
      <section class="card quick" style="padding-block:clamp(22px,3.5vw,36px)" aria-labelledby="qh">
        <h2 id="qh">Accesos rápidos</h2>
        <p>Todo lo que necesitas para entrar y estar al día.</p>
        <div class="links">
          <a class="link" href="#" data-connect><b>Conectar al servidor</b><span>Abre FiveM directo en Auren.</span></a>
          <a class="link" href="${esc(C.discord)}" target="_blank" rel="noopener"><b>Discord de Auren</b><span>Anuncios, tickets y compras VIP.</span></a>
          <a class="link" href="normativas.html"><b>Normativas</b><span>Las reglas de la ciudad, con buscador.</span></a>
          <a class="link" href="staff.html"><b>Panel del staff</b><span>Solo para el equipo de Auren.</span></a>
        </div>
      </section>
    </div>`;
  }

  A.user.then(u=> u ? userView(u) : loginView());
})();
</script>
</body>
</html>
